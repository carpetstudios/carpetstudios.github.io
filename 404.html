  <title>Page not found — Carpet Studios</title>

  <!-- GitHub Pages serves this page at any missing URL, at any depth, so point
       relative links at the site root. On a *.github.io project site the root is
       the first path segment; on a custom domain it is "/". Keep this script
       before any relative URL, and update the CSP hash above if you edit it. -->
  <script>(function () {
  if (location.protocol === "file:") return;
  var parts = location.pathname.split("/");
  var onProjectSite = /\.github\.io$/.test(location.hostname) && parts.length > 2;
  var base = document.createElement("base");
  base.href = onProjectSite ? "/" + parts[1] + "/" : "/";
  document.head.appendChild(base);
})();</script>
